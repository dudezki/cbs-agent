services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - /app/venv
    env_file:
      - ./api/.env
    # Restart on failure or use "always"
    restart: always

  ui:
    build: ./ui
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: always
